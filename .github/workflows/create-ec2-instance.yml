
name: Create EC2 Instance (Ubuntu 24.04)

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "Name tag for the EC2 instance"
        required: false
        default: "ostad-github-actions"

# Required permissions for GitHub OIDC authentication.
permissions:
  id-token: write
  contents: read

jobs:
  create-instance:
    name: Launch Ubuntu 24.04 EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      INSTANCE_TYPE: t3.micro
      AMI_OWNER: "099720109477"
      AMI_NAME_FILTER: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
      SG_NAME: "github-actions-ec2-sg"

    steps:

      # 1. Debug GitHub workflow context.
      - name: Debug GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # 2. Request GitHub OIDC token and inspect safe claims.
      - name: Debug OIDC Token Claims
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          (async () => {
            const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!tokenUrl || !requestToken) {
              throw new Error("GitHub OIDC environment variables are missing");
            }

            const url = new URL(tokenUrl);
            url.searchParams.set("audience", "sts.amazonaws.com");

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${requestToken}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: HTTP ${response.status}`);
            }

            const result = await response.json();

            if (!result.value) {
              throw new Error("OIDC token was not returned");
            }

            // Decode JWT payload only. Never print the actual token.
            const payload = result.value.split(".")[1];

            const claims = JSON.parse(
              Buffer.from(payload, "base64url").toString("utf8")
            );

            console.log("GitHub OIDC Claims:");
            console.log(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }, null, 2));
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      # 3. Authenticate with AWS using OIDC.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 4. Verify AWS identity.
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 5. Resolve latest Ubuntu 24.04 AMI.
      - name: Resolve Latest Ubuntu 24.04 AMI
        id: ami
        run: |
          set -euo pipefail

          echo "Finding Ubuntu 24.04 AMI..."

          AMI_ID=$(aws ec2 describe-images \
            --owners "$AMI_OWNER" \
            --filters \
              "Name=name,Values=${AMI_NAME_FILTER}" \
              "Name=state,Values=available" \
              "Name=architecture,Values=x86_64" \
              "Name=virtualization-type,Values=hvm" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text \
            --region "$AWS_REGION")

          if [[ -z "$AMI_ID" || "$AMI_ID" == "None" ]]; then
            echo "ERROR: Ubuntu AMI not found"
            exit 1
          fi

          echo "Ubuntu AMI: $AMI_ID"
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      # 6. Find or create Security Group.
      - name: Create or Reuse Security Group
        id: sg
        env:
          VPC_ID: ${{ secrets.EC2_VPC_ID }}
        run: |
          set -euo pipefail

          EXISTING_SG=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=$SG_NAME" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text \
            --region "$AWS_REGION")

          if [[ "$EXISTING_SG" != "None" && -n "$EXISTING_SG" ]]; then
            SG_ID="$EXISTING_SG"
            echo "Reusing Security Group: $SG_ID"
          else
            SG_ID=$(aws ec2 create-security-group \
              --group-name "$SG_NAME" \
              --description "GitHub Actions managed EC2 security group" \
              --vpc-id "$VPC_ID" \
              --region "$AWS_REGION" \
              --query "GroupId" \
              --output text)

            echo "Created Security Group: $SG_ID"
          fi

          # SSH is intentionally not exposed to the public internet.
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # 7. Launch EC2 instance.
      - name: Launch EC2 Instance
        id: launch
        env:
          INSTANCE_NAME: ${{ inputs.instance_name }}
          KEY_PAIR_NAME: ${{ secrets.EC2_KEY_PAIR_NAME }}
          INSTANCE_PROFILE: ${{ secrets.EC2_INSTANCE_PROFILE }}
          SUBNET_ID: ${{ secrets.EC2_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ steps.sg.outputs.sg_id }}
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type "$INSTANCE_TYPE" \
            --key-name "$KEY_PAIR_NAME" \
            --iam-instance-profile "Name=$INSTANCE_PROFILE" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SECURITY_GROUP_ID" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_NAME},{Key=CreatedBy,Value=github-actions},{Key=Workflow,Value=create-ec2},{Key=RunNumber,Value=${GITHUB_RUN_NUMBER}}]" \
            --region "$AWS_REGION" \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 8. Wait until EC2 is running.
      - name: Wait for Instance
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          set -euo pipefail

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Instance is running."

      # 9. Print deployment summary.
      - name: Deployment Summary
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          set -euo pipefail

          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[0].Instances[0].{
              InstanceId:InstanceId,
              State:State.Name,
              PublicIP:PublicIpAddress,
              PrivateIP:PrivateIpAddress,
              AZ:Placement.AvailabilityZone,
              InstanceType:InstanceType,
              Profile:IamInstanceProfile.Arn
            }" \
            --output table
