
name: Create EC2 Instance (Ubuntu 24.04)

on:
  workflow_dispatch:
    inputs:
      instance_name:
        description: "Name tag for the EC2 instance"
        required: false
        default: "ostad-github-actions"

# GitHub OIDC authentication permissions.
permissions:
  id-token: write
  contents: read

jobs:
  create-instance:
    name: Launch Ubuntu 24.04 EC2
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      INSTANCE_TYPE: t3.micro
      AMI_OWNER: "099720109477"
      AMI_NAME_FILTER: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
      SG_NAME: "github-actions-ec2-sg"

    steps:
      # 1. Debug GitHub context (does not expose credentials).
      - name: Debug GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Workflow: $GITHUB_WORKFLOW_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # 2. Authenticate with AWS using GitHub OIDC.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 3. Verify the assumed AWS identity.
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # 4. Find the latest official Ubuntu 24.04 AMI.
      - name: Resolve Latest Ubuntu 24.04 AMI
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners "$AMI_OWNER" \
            --filters \
              "Name=name,Values=${AMI_NAME_FILTER}" \
              "Name=state,Values=available" \
              "Name=architecture,Values=x86_64" \
              "Name=virtualization-type,Values=hvm" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text \
            --region "$AWS_REGION")

          if [[ -z "$AMI_ID" || "$AMI_ID" == "None" ]]; then
            echo "ERROR: Ubuntu AMI not found"
            exit 1
          fi

          echo "Ubuntu AMI: $AMI_ID"
          echo "ami_id=$AMI_ID" >> "$GITHUB_OUTPUT"

      # 5. Find or create the security group.
      - name: Create or Reuse Security Group
        id: sg
        env:
          VPC_ID: ${{ secrets.EC2_VPC_ID }}
        run: |
          EXISTING_SG=$(aws ec2 describe-security-groups \
            --filters \
              "Name=group-name,Values=$SG_NAME" \
              "Name=vpc-id,Values=$VPC_ID" \
            --query "SecurityGroups[0].GroupId" \
            --output text \
            --region "$AWS_REGION")

          if [[ "$EXISTING_SG" != "None" && -n "$EXISTING_SG" ]]; then
            SG_ID="$EXISTING_SG"
            echo "Reusing Security Group: $SG_ID"
          else
            SG_ID=$(aws ec2 create-security-group \
              --group-name "$SG_NAME" \
              --description "GitHub Actions EC2 security group" \
              --vpc-id "$VPC_ID" \
              --region "$AWS_REGION" \
              --query "GroupId" \
              --output text)

            echo "Created Security Group: $SG_ID"
          fi

          # Do not expose SSH to the entire internet.
          # Add a restricted TCP/22 rule separately if SSH is required.
          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"

      # 6. Launch the EC2 instance.
      - name: Launch EC2 Instance
        id: launch
        env:
          INSTANCE_NAME: ${{ inputs.instance_name }}
          KEY_PAIR_NAME: ${{ secrets.EC2_KEY_PAIR_NAME }}
          INSTANCE_PROFILE: ${{ secrets.EC2_INSTANCE_PROFILE }}
          SUBNET_ID: ${{ secrets.EC2_SUBNET_ID }}
          SECURITY_GROUP_ID: ${{ steps.sg.outputs.sg_id }}
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "$AMI_ID" \
            --instance-type "$INSTANCE_TYPE" \
            --key-name "$KEY_PAIR_NAME" \
            --iam-instance-profile "Name=$INSTANCE_PROFILE" \
            --subnet-id "$SUBNET_ID" \
            --security-group-ids "$SECURITY_GROUP_ID" \
            --associate-public-ip-address \
            --tag-specifications \
              "ResourceType=instance,Tags=[{Key=Name,Value=$INSTANCE_NAME},{Key=CreatedBy,Value=github-actions},{Key=Workflow,Value=create-ec2},{Key=RunNumber,Value=${GITHUB_RUN_NUMBER}}]" \
            --region "$AWS_REGION" \
            --query "Instances[0].InstanceId" \
            --output text)

          echo "Instance ID: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # 7. Wait until the instance is running.
      - name: Wait for Instance
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION"

          echo "Instance is running."

      # 8. Print deployment information.
      - name: Deployment Summary
        env:
          INSTANCE_ID: ${{ steps.launch.outputs.instance_id }}
        run: |
          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Reservations[0].Instances[0].{
              InstanceId:InstanceId,
              State:State.Name,
              PublicIP:PublicIpAddress,
              PrivateIP:PrivateIpAddress,
              AZ:Placement.AvailabilityZone,
              InstanceType:InstanceType,
              Profile:IamInstanceProfile.Arn
            }" \
            --output table
